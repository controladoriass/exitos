<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Êxitos — Silva &amp; Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E223F;
    --gold:#CFA36E;
    --gold-soft:#b98b4f;
    --txt:#1E223F;
    --txt-dim:#6b7183;
    --line:rgba(30,34,63,.12);
    --ok:#2e8b62;
    --err:#c0392b;
    --field-bg:#ffffff;
    --field-border:#d7dae4;
    --card-bg:#ffffff;
    --page-bg:#f4f5f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Montserrat',system-ui,Arial,sans-serif;
    background:var(--page-bg);
    color:var(--txt);
    min-height:100vh;
    padding:36px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto}

  /* ---- Cabeçalho ---- */
  header.top{
    text-align:center;
    margin-bottom:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header.top img#logo{
    display:block;height:38px;width:auto;max-width:100%;margin:0 auto;opacity:.92;
  }
  header.top h1{
    margin-top:16px;
    font-size:23px;font-weight:700;line-height:1.15;letter-spacing:.01em;color:var(--navy);
    display:inline-flex;align-items:center;gap:11px;justify-content:center;
  }
  .tick{
    display:inline-block;width:13px;height:21px;background:var(--gold);
    transform:skewX(-16deg);border-radius:2px;
  }

  /* ---- Card ---- */
  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px 30px 34px;
    box-shadow:0 10px 34px rgba(30,34,63,.08);
  }
  .sec-title{
    display:flex;align-items:center;gap:12px;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold-soft);font-weight:600;margin:6px 0 20px;
  }
  .sec-title:before{
    content:"";width:12px;height:20px;background:var(--gold);
    transform:skewX(-16deg);border-radius:2px;display:inline-block;
  }
  .sec-title.mt{margin-top:30px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field.full{grid-column:1 / -1}
  label{
    font-size:12.5px;font-weight:600;letter-spacing:.03em;color:var(--txt);
    display:flex;align-items:center;gap:6px;
  }
  label .opt{
    font-size:10.5px;font-weight:500;color:var(--txt-dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  label .req{color:var(--gold);font-weight:700}

  input,select,textarea{
    font-family:inherit;font-size:15px;color:var(--txt);
    background:var(--field-bg);
    border:1px solid var(--field-border);
    border-radius:10px;padding:12px 14px;width:100%;
    transition:border-color .18s, background .18s, box-shadow .18s;
  }
  input::placeholder,textarea::placeholder{color:#a3a8b6}
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--gold);
    background:#fffdf9;
    box-shadow:0 0 0 3px rgba(207,163,110,.18);
  }
  select{
    appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23CFA36E' stroke-width='2.4'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;
  }
  select option{background:#ffffff;color:var(--txt)}
  textarea{resize:vertical;min-height:88px}

  /* campo valor com prefixo R$ */
  .money{position:relative}
  .money .cur{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--gold);font-weight:600;font-size:15px;pointer-events:none;
  }
  .money input{padding-left:38px}

  /* ---- Botão (centralizado) ---- */
  .actions{
    margin-top:28px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;
  }
  button.submit{
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.03em;
    color:#ffffff;background:var(--navy);
    border:none;border-radius:10px;padding:14px 40px;cursor:pointer;
    transition:transform .12s, box-shadow .18s, background .18s;
    box-shadow:0 8px 22px rgba(30,34,63,.22);
  }
  button.submit:hover{background:#2a2f52;transform:translateY(-1px)}
  button.submit:active{transform:translateY(0)}
  button.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(9,10,20,.55);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
    opacity:0;transition:opacity .18s;
  }
  .modal-overlay.show{display:flex;opacity:1}
  .modal-box{
    background:#fff;border-radius:16px;padding:34px 30px 30px;
    width:100%;max-width:360px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.28);
    transform:translateY(8px) scale(.98);transition:transform .2s;
  }
  .modal-overlay.show .modal-box{transform:translateY(0) scale(1)}
  .modal-txt{font-size:16px;font-weight:600;color:var(--navy);line-height:1.4;margin-top:6px}

  /* spinner (enviando) */
  .modal-loading{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0}
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:4px solid rgba(30,34,63,.12);border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* check animado (sucesso) */
  .modal-done{display:flex;flex-direction:column;align-items:center;gap:14px}
  .check-circle{margin-bottom:2px}
  .ck-c{stroke:var(--ok);stroke-width:3;stroke-dasharray:150;stroke-dashoffset:150;animation:dash .5s ease forwards}
  .ck-p{stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dash .35s .4s ease forwards}
  @keyframes dash{to{stroke-dashoffset:0}}

  /* erro */
  .modal-err{display:flex;flex-direction:column;align-items:center;gap:14px}
  .err-circle{
    width:52px;height:52px;border-radius:50%;background:var(--err);color:#fff;
    font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }

  .modal-close{
    margin-top:12px;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.03em;
    color:#fff;background:var(--navy);border:none;border-radius:9px;
    padding:11px 34px;cursor:pointer;transition:background .18s,transform .1s;
  }
  .modal-close:hover{background:#2a2f52;transform:translateY(-1px)}
  .modal-close.alt{background:var(--err)}
  .modal-close.alt:hover{background:#a93226}

  /* ---- Dropzone de anexos ---- */
  .dropzone{
    border:1.5px dashed var(--field-border);
    border-radius:12px;
    background:#fafbfc;
    padding:22px 18px;
    display:flex;align-items:center;justify-content:center;gap:12px;
    text-align:center;cursor:pointer;color:var(--txt-dim);
    transition:border-color .18s, background .18s, color .18s;
  }
  .dropzone:hover,.dropzone:focus{
    outline:none;border-color:var(--gold);background:#fffdf9;color:var(--navy);
  }
  .dropzone.dragover{border-color:var(--gold);background:rgba(207,163,110,.10);color:var(--navy)}
  .dz-ico{flex:0 0 auto;color:var(--gold)}
  .dz-txt{font-size:13.5px;font-weight:600;line-height:1.35}
  .dz-txt small{font-weight:500;color:var(--txt-dim);font-size:11.5px}

  .file-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
  .file-list li{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--field-border);border-radius:9px;
    padding:9px 12px;font-size:13px;color:var(--navy);
  }
  .file-list li .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .file-list li .fsize{color:var(--txt-dim);font-size:11.5px;flex:0 0 auto}
  .file-list li .frm{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(192,57,43,.10);color:var(--err);font-size:15px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .file-list li .frm:hover{background:rgba(192,57,43,.22)}

  @media (max-width:560px){
    .grid{grid-template-columns:1fr}
    header.top h1{font-size:24px}
    .card{padding:24px 20px 28px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <img id="logo" alt="Silva &amp; Silva Advogados Associados">
    <h1><span class="tick"></span>Cadastro de Êxitos</h1>
  </header>

  <form id="form" class="card" autocomplete="off">

    <div class="sec-title">Dados do lançamento</div>

    <div class="grid">

      <div class="field full">
        <label>Tipo de Êxito <span class="req">*</span></label>
        <select id="tipo" required>
          <option value="" disabled selected>Selecione o tipo…</option>
          <option value="Êxito Judicial">Êxito Judicial</option>
          <option value="Sucumbência">Sucumbência</option>
          <option value="Extrajudicial">Extrajudicial</option>
        </select>
      </div>

      <div class="field">
        <label id="lbl-num">Número do processo <span class="req">*</span></label>
        <input type="text" id="processo" placeholder="0000000-00.0000.0.00.0000" required>
      </div>

      <div class="field">
        <label>Cliente <span class="req">*</span></label>
        <input type="text" id="cliente" placeholder="Nome do cliente" required>
      </div>

      <div class="field full">
        <label id="lbl-valor">Valor do Êxito <span class="req">*</span></label>
        <div class="money">
          <span class="cur">R$</span>
          <input type="text" id="valor" inputmode="decimal" placeholder="0,00" required>
        </div>
      </div>

    </div>

    <div class="sec-title mt">Centro de receita</div>

    <div class="grid">

      <div class="field">
        <label>Cidade <span class="req">*</span></label>
        <select id="cidade" required>
          <option value="" disabled selected>Selecione…</option>
          <option value="Florianópolis">Florianópolis</option>
          <option value="Sinop">Sinop</option>
          <option value="Itapema">Itapema</option>
        </select>
      </div>

      <div class="field">
        <label>Área Jurídica <span class="req">*</span></label>
        <select id="area" required>
          <option value="" disabled selected>Selecione…</option>
          <option value="Contencioso">Contencioso</option>
          <option value="Trabalhista">Trabalhista</option>
          <option value="Bancário">Bancário</option>
          <option value="Criminal">Criminal</option>
          <option value="Público">Público</option>
          <option value="Tributário">Tributário</option>
          <option value="Extrajudicial">Extrajudicial</option>
        </select>
      </div>

      <div class="field full">
        <label>Centro de Custo <span class="req">*</span></label>
        <select id="centro" required disabled>
          <option value="" disabled selected>Escolha a Área Jurídica primeiro…</option>
        </select>
      </div>

      <div class="field full">
        <label>Anexos <span class="opt">(opcional)</span></label>
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Anexar arquivos">
          <input type="file" id="arquivos" multiple hidden>
          <svg class="dz-ico" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="dz-txt">Clique ou arraste arquivos aqui<br><small>qualquer formato · pode selecionar vários</small></span>
        </div>
        <ul class="file-list" id="fileList"></ul>
      </div>

    </div>

    <div class="sec-title mt">Complemento</div>

    <div class="grid">
      <div class="field full">
        <label>Observações <span class="opt">(opcional)</span></label>
        <textarea id="obs" placeholder="Ex.: cadastrar sem cobrança / detalhes do êxito…"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="submit" id="btn">Registrar êxito</button>
    </div>

  </form>

</div>

<!-- ===== Modal de confirmação ===== -->
<div class="modal-overlay" id="modal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
    <!-- estado: enviando -->
    <div class="modal-loading" id="modalLoading">
      <div class="spinner"></div>
      <p class="modal-txt">Registrando êxito…</p>
    </div>
    <!-- estado: sucesso -->
    <div class="modal-done" id="modalDone" style="display:none">
      <div class="check-circle">
        <svg viewBox="0 0 52 52" width="52" height="52"><circle class="ck-c" cx="26" cy="26" r="23" fill="none"/><path class="ck-p" fill="none" d="M15 27 l7 7 l15 -16"/></svg>
      </div>
      <p class="modal-txt" id="modalMsg">Êxito registrado na planilha!</p>
      <button type="button" class="modal-close" id="modalClose">Fechar</button>
    </div>
    <!-- estado: erro -->
    <div class="modal-err" id="modalErr" style="display:none">
      <div class="err-circle">!</div>
      <p class="modal-txt" id="modalErrMsg">Não foi possível registrar.</p>
      <button type="button" class="modal-close alt" id="modalCloseErr">Fechar</button>
    </div>
  </div>
</div>

const $ = id => document.getElementById(id);

/* % do centro primário por área (Tabela 14.2) — vai gravado na coluna "Centro de Receita" */
const AREAS = {
  "Contencioso":   8.33,
  "Trabalhista":   8.33,
  "Bancário":      4.17,
  "Criminal":      2.92,
  "Público":       8.33,
  "Tributário":    8.33,
  "Extrajudicial": 8.33
};
function pctArea(area){
  const v = AREAS[area];
  return (v === undefined) ? "" : v.toFixed(2).replace(".",",")+"%";
}

const SEM_CENTRO = "Sem centro de custo";

/* Quando escolhe a Área, monta o dropdown Centro de Custo com 2 opções:
   "Área — %"  e  "Êxito sem centro de custo" */
function montarCentro(){
  const area = $("area").value;
  const sel  = $("centro");
  if(!area){
    sel.innerHTML = '<option value="" disabled selected>Escolha a Área Jurídica primeiro…</option>';
    sel.disabled = true;
    return;
  }
  const pct = pctArea(area);
  sel.innerHTML =
    '<option value="" disabled selected>Selecione…</option>' +
    '<option value="'+pct+'">'+area+' — '+pct+'</option>' +
    '<option value="'+SEM_CENTRO+'">Êxito sem centro de custo</option>';
  sel.disabled = false;
}
$("area").addEventListener("change", montarCentro);

/* ---------- Anexos (drag & drop + clique + lista) ---------- */
let arquivosSelecionados = []; // {file, id}
let seqArquivo = 0;

function humanSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1048576) return (bytes/1024).toFixed(0) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}
function renderFileList(){
  const ul = $("fileList");
  ul.innerHTML = "";
  arquivosSelecionados.forEach(item=>{
    const li = document.createElement("li");
    li.innerHTML =
      '<span class="fname"></span>' +
      '<span class="fsize">'+humanSize(item.file.size)+'</span>' +
      '<button type="button" class="frm" aria-label="Remover">&times;</button>';
    li.querySelector(".fname").textContent = item.file.name;
    li.querySelector(".frm").addEventListener("click", ()=>{
      arquivosSelecionados = arquivosSelecionados.filter(a=>a.id !== item.id);
      renderFileList();
    });
    ul.appendChild(li);
  });
}
function adicionarArquivos(fileList){
  Array.from(fileList).forEach(f=>{
    arquivosSelecionados.push({file:f, id:++seqArquivo});
  });
  renderFileList();
}

const dz = $("dropzone");
dz.addEventListener("click", ()=> $("arquivos").click());
dz.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("arquivos").click(); } });
$("arquivos").addEventListener("change", e=>{ adicionarArquivos(e.target.files); e.target.value=""; });
["dragenter","dragover"].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add("dragover"); }));
["dragleave","drop"].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove("dragover"); }));
dz.addEventListener("drop", e=>{ if(e.dataTransfer.files) adicionarArquivos(e.dataTransfer.files); });

/* Lê os arquivos como base64 para enviar ao Apps Script */
function lerArquivoBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>{
      // r.result = "data:mime;base64,XXXX" → separa
      const base64 = String(r.result).split(",")[1] || "";
      resolve({ nome:file.name, tipo:file.type||"application/octet-stream", dados:base64 });
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function anexosParaEnvio(){
  const lidos = [];
  for(const item of arquivosSelecionados){
    lidos.push(await lerArquivoBase64(item.file));
  }
  return lidos;
}

/* ---------- Máscara de moeda ---------- */
function formatMoney(raw){
  let d = raw.replace(/\D/g,"");
  if(!d){ return ""; }
  d = (parseInt(d,10)/100).toFixed(2);
  return d.replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
}
function moneyToNumber(str){
  if(!str) return 0;
  return parseFloat(str.replace(/\./g,"").replace(",",".")) || 0;
}
$("valor").addEventListener("input", e=>{
  const pos = e.target.value.length;
  e.target.value = formatMoney(e.target.value);
});

/* ---------- Rótulos dinâmicos por tipo ---------- */
$("tipo").addEventListener("change", ()=>{
  const t = $("tipo").value;
  const lblV = $("lbl-valor");
  const lblN = $("lbl-num");
  if(t === "Sucumbência"){ lblV.innerHTML = 'Valor da Sucumbência <span class="req">*</span>'; }
  else if(t === "Extrajudicial"){ lblV.innerHTML = 'Valor do Resultado <span class="req">*</span>'; }
  else { lblV.innerHTML = 'Valor do Êxito <span class="req">*</span>'; }

  // Extrajudicial normalmente não tem nº de processo → vira opcional
  if(t === "Extrajudicial"){
    lblN.innerHTML = 'Número do processo <span class="opt">(opcional)</span>';
    $("processo").required = false;
    // sugere a área Extrajudicial
    if(!$("area").value) $("area").value = "Extrajudicial";
  } else {
    lblN.innerHTML = 'Número do processo <span class="req">*</span>';
    $("processo").required = true;
  }
  recalc();
});

/* ---------- Modal ---------- */
function modalReset(){
  $("modalLoading").style.display = "flex";
  $("modalDone").style.display    = "none";
  $("modalErr").style.display     = "none";
}
function abrirModalLoading(){
  modalReset();
  $("modal").classList.add("show");
  $("modal").setAttribute("aria-hidden","false");
}
function modalSucesso(){
  $("modalLoading").style.display = "none";
  $("modalErr").style.display     = "none";
  $("modalDone").style.display    = "flex";
  // reinicia a animação do check
  const done = $("modalDone");
  done.querySelectorAll(".ck-c,.ck-p").forEach(el=>{
    el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  });
  $("modalClose").focus();
}
function modalErro(texto){
  $("modalLoading").style.display = "none";
  $("modalDone").style.display    = "none";
  $("modalErr").style.display     = "flex";
  if(texto) $("modalErrMsg").textContent = texto;
  $("modalCloseErr").focus();
}
function fecharModal(){
  $("modal").classList.remove("show");
  $("modal").setAttribute("aria-hidden","true");
}
// Fechar (sucesso) → limpa tudo pra novo preenchimento
$("modalClose").addEventListener("click", ()=>{
  fecharModal();
  resetForm();
});
// Fechar (erro) → mantém o que foi digitado
$("modalCloseErr").addEventListener("click", fecharModal);

/* ---------- Envio ---------- */
$("form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = $("btn");

  if(moneyToNumber($("valor").value) <= 0){
    $("valor").focus(); return;
  }

  btn.disabled = true;
  abrirModalLoading();
  const t0 = Date.now();
  const minLoading = 1400; // garante que a caixa de "carregando" apareça por alguns segundos

  // termina mostrando sucesso/erro, respeitando o tempo mínimo de loading
  const finalizar = (ok, textoErro)=>{
    const espera = Math.max(0, minLoading - (Date.now() - t0));
    setTimeout(()=>{
      if(ok) modalSucesso(); else modalErro(textoErro);
      btn.disabled = false;
    }, espera);
  };

  // Lê os anexos (base64) — pode demorar se forem grandes
  let anexos = [];
  try{
    anexos = await anexosParaEnvio();
  }catch(err){
    console.error("erro lendo anexos:", err);
    finalizar(false, "Não foi possível ler os arquivos anexados.");
    return;
  }

  const payload = {
    dataHora:      new Date().toLocaleString("pt-BR"),
    tipo:          $("tipo").value,
    processo:      $("processo").value.trim(),
    cliente:       $("cliente").value.trim(),
    valor:         moneyToNumber($("valor").value),
    valorTexto:    "R$ " + $("valor").value,
    cidade:        $("cidade").value,
    area:          $("area").value,
    centroReceita: $("centro").value,
    observacoes:   $("obs").value.trim(),
    anexos:        anexos   // [{nome, tipo, dados(base64)}]
  };

  // MODO TESTE
  if(!APPS_SCRIPT_URL){
    console.log("[MODO TESTE] payload (anexos:"+anexos.length+"):", payload);
    finalizar(true);
    return;
  }

  try{
    await fetch(APPS_SCRIPT_URL, {
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    finalizar(true);
  }catch(err){
    console.error("fetch no-cors falhou:", err);
    // sendBeacon só serve p/ payload pequeno (sem anexos)
    if(anexos.length === 0){
      try{
        const blob = new Blob([JSON.stringify(payload)], {type:"text/plain;charset=utf-8"});
        if(navigator.sendBeacon(APPS_SCRIPT_URL, blob)){ finalizar(true); return; }
      }catch(_){}
    }
    finalizar(false, "Não foi possível registrar. Tente novamente.");
  }
});

function resetForm(){
  $("form").reset();
  $("lbl-valor").innerHTML = 'Valor do Êxito <span class="req">*</span>';
  $("lbl-num").innerHTML = 'Número do processo <span class="req">*</span>';
  $("processo").required = true;
  montarCentro(); // volta o Centro de Custo ao estado inicial (desabilitado)
  arquivosSelecionados = []; renderFileList(); // limpa anexos
}
</script>
